- hosts: appservers
  
  tasks:
    - name: update apt
      ansible.builtin.apt:
        update_cache: true
      tags: apt_update
  
    - name: install git
      ansible.builtin.apt:
        name: git
        state: latest
      become: yes
      tags: git

    - name: install make
      ansible.builtin.apt:
        name: make
        state: present
      become: yes
      tags: make

    - name: create user arya
      ansible.builtin.user:
        name: arya
      tags: users

    - name: create user sansa
      ansible.builtin.user:
        name: sansa
      tags: users

    - name: create user tirion
      ansible.builtin.user:
        name: tirion
      tags: users